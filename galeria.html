<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Galería de eventos 5★ GL – Ramon Curbalán</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #e3e3e3;
    }

    /* Fondo general y centrado del Mac */
    .galeria-body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 0;
    }

    .laptop-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    /* Imagen del iMac / MacBook con tu wallpaper dentro */
    .laptop-frame {
      position: relative;
      width: 1200px;
      max-width: 96vw;
      aspect-ratio: 16 / 9;
      background-image: url("fondo_iOS.png"); /* ← imagen con el Mac + wallpaper */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Zona donde va la “ventana” de Safari con la galería */
    .laptop-screen {
      position: absolute;
      /* Ajusta estos valores para encajar la ventana donde quieras en el Mac */
      top: 90px;
      left: 80px;
      right: 80px;
      bottom: 130px;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    /* Ventana tipo Safari */
    .browser-window {
      width: 100%;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .browser-topbar {
      height: 34px;
      display: flex;
      align-items: center;
      padding: 0 12px 0 14px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.95), rgba(235,238,245,0.9));
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }

    .browser-buttons {
      display: flex;
      gap: 6px;
      margin-right: 16px;
    }

    .browser-buttons .btn {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .browser-buttons .close { background: #ff5f57; }
    .browser-buttons .minimize { background: #febc2e; }
    .browser-buttons .maximize { background: #28c840; }

    .browser-url {
      flex: 1;
      height: 22px;
      border-radius: 999px;
      background: rgba(255,255,255,0.95);
      border: 1px solid rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      padding: 0 10px;
      font-size: 11px;
      color: #666;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .browser-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 18px 20px 22px;
    }

    /* Scrollbar tipo macOS */
    .browser-content::-webkit-scrollbar {
      width: 8px;
    }
    .browser-content::-webkit-scrollbar-track {
      background: #edf0f4;
      border-radius: 8px;
    }
    .browser-content::-webkit-scrollbar-thumb {
      background-color: #3d8db8;
      border-radius: 8px;
      border: 2px solid #edf0f4;
    }
    .browser-content::-webkit-scrollbar-thumb:hover {
      background-color: #2f6f92;
    }
    .browser-content {
      scrollbar-width: thin;
      scrollbar-color: #3d8db8 #edf0f4;
    }

    /* Contenido de la galería */
    .galeria {
      max-width: 100%;
    }

    .galeria h1 {
      font-size: 22px;
      margin-bottom: 6px;
      color: #111827;
    }

    .galeria-intro {
      font-size: 13px;
      color: #4b5563;
      margin-bottom: 18px;
      padding: 6px 12px;
      border-radius: 999px;
      display: inline-block;
      background: rgba(255,255,255,0.85);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .galeria-grid {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .galeria-grid figure {
      background: #ffffff;
      border: 1px solid #e1e1e1;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 3px 8px rgba(0,0,0,0.05);
    }

    .galeria-grid img {
      width: 100%;
      height: 135px;
      object-fit: cover;
      display: block;
    }

    .galeria-grid figcaption {
      font-size: 13px;
      color: #444;
      padding: 10px 12px 12px;
      line-height: 1.35;
    }

    /* Responsive: tablet / móvil */
    @media (max-width: 1024px) {
      .galeria-body {
        align-items: flex-start;
        padding: 16px 0;
      }

      .laptop-frame {
        width: 100vw;
        max-width: 100vw;
      }

      .laptop-screen {
        top: 70px;
        left: 18px;
        right: 18px;
        bottom: 120px;
      }

      .galeria-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 650px) {
      .laptop-screen {
        top: 55px;
        left: 10px;
        right: 10px;
        bottom: 90px;
      }

      .browser-window {
        border-radius: 12px;
      }

      .browser-content {
        padding: 14px 14px 16px;
      }

      .galeria-grid {
        grid-template-columns: 1fr; /* una columna en móvil */
      }
    }

  </style>
</head>

<body class="galeria-body">
  <div class="laptop-wrapper">
    <div class="laptop-frame">
      <div class="laptop-screen">
        <div class="browser-window">
          <div class="browser-topbar">
            <div class="browser-buttons">
              <span class="btn close"></span>
              <span class="btn minimize"></span>
              <span class="btn maximize"></span>
            </div>
            <div class="browser-url">www.ramon-curbalan.com/galeria</div>
          </div>

          <div class="browser-content">
            <main class="galeria">
              <h1>Galería de eventos 5★ GL</h1>
              <p class="galeria-intro">
                Selección de fotos con montajes para distintas ocaciones ,coffee stations, cenas y almuerzos de galas y servicios especiales desarrollados en entornos de alta exigencia.
              </p>

              <div class="galeria-grid">
                <figure>
                  <img src="imagenes/coffee-station-1.jpg" alt="Drink station premium">
                  <figcaption>Drink station premium para convenciones corporativas.</figcaption>
                </figure>

                <figure>
                  <img src="imgagenes/coffee-station-2.jpg" alt="Coffee station premium">
                  <figcaption>Coffee station premium para convenciones corporativas.</figcaption>
                </figure>

                <figure>
                  <img src="imgagenes/coffee-station-3.jpg" alt="Coffee station especial">
                  <figcaption>Coffee station especial edition.</figcaption>
                </figure>

                <figure>
                  <img src="imgagenes/restaurante-almuerzo.jpg" alt="Restaurante corporativo">
                  <figcaption>Sala de restaurante con montaje para almuerzo corporativo.</figcaption>
                </figure>

                <figure>
                  <img src="imgagenes/mesa-privada.jpg" alt="Mesa privada">
                  <figcaption>Mesa de cena privada para alta dirección y reuniones estratégicas.</figcaption>
                </figure>

                <figure>
                  <img src="imgagenes/gala.jpg" alt="Cena de gala 5★ GL">
                  <figcaption>Cocktail recepción especial para evento de grupos.</figcaption>
                </figure>

                <!-- puedes seguir añadiendo más figuras aquí -->
              </div>
            </main>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
