name: Import original event manual
on:
  push:
    paths:
      - '.github/workflows/import-original-event-manual.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-manual:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original PDF without modification
        env:
          SOURCE_PDF_URL: 'https://d2ol7oe51mr4n9.cloudfront.net/user_3IHAZtjGdFzomzk5Pp0lAW9zg6A/f5d04754-e3bd-4f45-8f9c-ada40f7280e6.pdf'
        run: |
          curl --fail --location --silent --show-error --retry 3 "$SOURCE_PDF_URL" -o 'PDF/Manual_Ejecutivo_Eventos_Editable.pdf'
          echo 'dc056f7b633eaef4cf10eac145182bc84bd4e0025a034b5cdac9caf1085a38cc  PDF/Manual_Ejecutivo_Eventos_Editable.pdf' | sha256sum --check
      - name: Update only manual links in home page
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); a='documento.html?file=PDF%2FManual_premium.pdf&from=index.html'; b='documento.html?file=PDF%2FManual_Ejecutivo_Eventos_Editable.pdf&from=index.html'; assert s.count(a)==2, 'unexpected manual links'; p.write_text(s.replace(a,b))"
      - name: Commit the unchanged original PDF and updated links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'PDF/Manual_Ejecutivo_Eventos_Editable.pdf' index.html
          git commit -m "Replace event manual with original supplied PDF"
          git push origin HEAD:main
