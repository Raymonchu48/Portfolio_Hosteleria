name: Import original leadership PDF
on:
  push:
    paths:
      - '.github/workflows/import-original-equipos-pdf.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-document:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import original PDF without edits
        env:
          SOURCE_PDF_URL: 'https://d2ol7oe51mr4n9.cloudfront.net/user_3IHAZtjGdFzomzk5Pp0lAW9zg6A/f4ac4f9c-663d-49e9-a8a8-d982528755ee.pdf'
        run: |
          curl --fail --location --silent --show-error --retry 3 "$SOURCE_PDF_URL" -o 'PDF/Gestion_Equipos_Liderazgo_Portfolio.pdf'
          echo '921472c419e8a2f2c003a59e3c5b2591f23d41f607d2ec1b40d0d7c713fe6e31  PDF/Gestion_Equipos_Liderazgo_Portfolio.pdf' | sha256sum --check
      - name: Update only Gestion de equipos button
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); a='documento.html?file=PDF%2FGestion-Equipos.pdf&from=index.html'; b='documento.html?file=PDF%2FGestion_Equipos_Liderazgo_Portfolio.pdf&from=index.html'; assert s.count(a)==1, 'Unexpected source link count'; p.write_text(s.replace(a,b))"
      - name: Commit exact PDF and button destination
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'PDF/Gestion_Equipos_Liderazgo_Portfolio.pdf' index.html
          git commit -m "Replace leadership button PDF with provided original"
          git push origin HEAD:main
