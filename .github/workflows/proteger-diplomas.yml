name: Proteger DNI en diplomas publicados
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sanitize_diplomas_publicos.py'
      - '.github/workflows/proteger-diplomas.yml'

permissions:
  contents: write

jobs:
  sanear-diplomas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener portfolio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias de saneamiento
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
          python -m pip install --quiet 'pymupdf>=1.24,<1.27' 'pillow>=10,<13' 'pytesseract>=0.3.10,<0.4'
      - name: Eliminar identificadores en documentos públicos
        run: python scripts/sanitize_diplomas_publicos.py
      - name: Publicar solo archivos saneados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diplomas/
          if ! git diff --cached --quiet; then
            git commit -m "privacy: eliminar DNI/NIE de diplomas publicados"
            git push
          else
            echo "No hay cambios: no se encontraron identificadores válidos."
          fi
