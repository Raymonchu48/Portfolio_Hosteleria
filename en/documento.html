<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <title>Document Viewer · RACV Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--deep:#081318;--panel:#0d1d24;--line:rgba(144,196,210,.22);--cyan:#73b9ca;--cyan2:#9dd2de;--gold:#c7a36a;--ink:#eaf3f5;--muted:#8ea5ac}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Manrope',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}body{background:linear-gradient(135deg,#071116,#0b171d 48%,#081318);color:var(--ink)}
    .viewer{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.viewer-bar{position:sticky;top:0;z-index:20;min-height:72px;padding:12px 18px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;background:rgba(6,16,20,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
    .actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.035);color:#dcebed;padding:9px 12px;font-size:9px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:.2s}.btn:hover{border-color:rgba(157,210,222,.55);background:rgba(115,185,202,.12)}.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#071419}.btn.primary:hover{background:var(--cyan2)}
    .doc-meta{min-width:0;text-align:center}.doc-meta strong{display:block;font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.doc-meta span{display:block;margin-top:3px;color:var(--muted);font-size:8px;letter-spacing:.12em;text-transform:uppercase}.status{color:var(--gold);font-size:8px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
    .viewport{min-height:0;padding:14px;background:radial-gradient(circle at 50% 0,rgba(115,185,202,.08),transparent 32%)}.frame{width:100%;height:calc(100vh - 100px);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#f4f5f5;box-shadow:0 20px 70px rgba(0,0,0,.3)}iframe{width:100%;height:100%;border:0;background:#fff}.image-wrap{width:100%;height:100%;overflow:auto;display:grid;place-items:center;padding:20px;background:#e9ecee}.image-wrap img{display:block;max-width:100%;height:auto;max-height:none;box-shadow:0 12px 45px rgba(0,0,0,.18);background:#fff}.error{height:100%;display:grid;place-items:center;padding:30px;text-align:center;color:#53636a}.error strong{display:block;font-family:'Fraunces',Georgia,serif;font-size:27px;color:#263840;margin-bottom:8px}
    @media(max-width:700px){.viewer-bar{grid-template-columns:1fr;gap:9px}.doc-meta{text-align:left;order:-1}.doc-meta strong{font-size:15px}.status{display:none}.actions{justify-content:flex-start}.viewport{padding:8px}.frame{height:calc(100vh - 138px);border-radius:10px}}
  </style>
  <link rel="stylesheet" href="refined-depth.css?v=20261010-1">
  <link rel="stylesheet" href="language-switch.css">
  <script src="language-preference.js"></script>
</head>
<body class="document-page">
  <div class="viewer">
    <header class="viewer-bar">
      <div class="actions"><nav class="language-switch" aria-label="Language"><a href="documento.html?lang=es" lang="es" aria-label="Español">🇪🇸 ES</a><a href="en/documento.html?lang=en" lang="en" aria-label="English" aria-current="page">🇬🇧 EN</a></nav>
        <a class="btn primary" href="en/index.html">← Home</a>
        <button class="btn" id="backBtn" type="button">← Back</button>
      </div>
      <div class="doc-meta"><strong id="docTitle">Professional document</strong><span>RACV // Document Viewer</span></div>
      <div class="actions"><a class="btn" id="originalLink" href="en/index.html" target="_blank" rel="noopener">Open original ↗</a><span class="status" id="status">READY</span></div>
    </header>
    <main class="viewport"><div class="frame" id="frame"></div></main>
  </div>
  <script>
    const params=new URLSearchParams(location.search);
    const requestedFile=params.get('file')||'';
    const englishDocuments={"PDF/Curriculum_2026.pdf": "en/PDF/Curriculum_2026_EN.pdf", "PDF/Gestion_Equipos_Liderazgo_Portfolio.pdf": "en/PDF/Gestion_Equipos_Liderazgo_Portfolio_EN.pdf", "PDF/Servicio.pdf": "en/PDF/Servicio_EN.pdf", "PDF/PTD.pdf": "en/PDF/PTD_EN.pdf", "PDF/Manual_Ejecutivo_Eventos_Editable.pdf": "en/PDF/Manual_Ejecutivo_Eventos_Editable_EN.pdf"};
    const file=englishDocuments[requestedFile]||requestedFile;
    const from=params.get('from')||'en/index.html';
    const safeFrom=['index.html','diplomas.html','galeria.html','en/index.html','en/diplomas.html','en/galeria.html'].includes(from)?from:'en/index.html';
    const isSafe=/^(?!\/\/)(?!.*\.\.)(?!.*:\/\/)[^?#]+\.(pdf|jpg|jpeg|png|webp)$/i.test(file);
    const frame=document.getElementById('frame');
    const titleEl=document.getElementById('docTitle');
    const original=document.getElementById('originalLink');
    const status=document.getElementById('status');
    const documentTitles={"en/PDF/Curriculum_2026_EN.pdf":"Executive CV · 2026","en/PDF/Servicio_EN.pdf":"Service quality","en/PDF/Manual_Ejecutivo_Eventos_Editable_EN.pdf":"Executive events manual","en/PDF/Gestion_Equipos_Liderazgo_Portfolio_EN.pdf":"Team management and leadership","en/PDF/PTD_EN.pdf":"Strategic project and business management","diplomas/Diploma Gestion de la Restauracion.pdf":"HOTR040PO · Food Service Management","diplomas/Diploma Gestion de Cocinas.pdf":"HOTR061PO · Kitchen Management Skills and Competencies","diplomas/servicio en restaurantes y bares.pdf":"HOTR064PO · Restaurant and Bar Service","diplomas/Gestion calidad servicio restaurantes.pdf":"Service Quality Management in Hospitality","diplomas/Analisis -Rentabilidad-Hoteles.pdf":"Hotel Profitability Analysis","diplomas/certificado_somellier_marinaje.pdf":"Wine Service and Food Pairing","diplomas/Certificado_Enologia_Cata.pdf":"Winemaking and Wine Tasting","diplomas/DIPLOMA_aprovechamiento_Estatal_Turismo_2021.pdf":"ADGX01 · English for Business Management","diplomas/Diploma Master en Administración de Empresas.pdf":"Master’s Programme in Business Administration and Management","diplomas/Diploma Master_direccion_Hotelera1.pdf":"Master’s Programme in Tourism and Hotel Management","diplomas/diploma salarios y contratacion.pdf":"ADGD240PO · Pay and Employment Contracts","diplomas/Certificado_LOGISTICA URBANA INTELIGENTE DE MERCANCIAS.pdf":"Smart Urban Freight Logistics","diplomas/IMG_20200819_190321.jpg":"Design Thinking","diplomas/IMG_20200826_184107.jpg":"Harvard Negotiation Method","diplomas/Diploma Psicologia colectiva.pdf":"Master’s Programme in Personal, Social and Emotional Development Psychology","diplomas/Certificate inteligencia emocional.pdf":"The Principles of Emotional Intelligence, Leadership and Coaching","diplomas/BTE_165365_2021 Copiar.pdf":"Accreditation of Food Service Competency Units"};
    const pretty=documentTitles[file]||(file.split('/').pop()||'Document').replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim();
    titleEl.textContent=pretty||'Professional document';
    document.title=(pretty||'Document')+' · RACV Portfolio';
    document.getElementById('backBtn').addEventListener('click',()=>{if(history.length>1)history.back();else location.href=safeFrom});
    if(!isSafe){status.textContent='INVALID';frame.innerHTML='<div class="error"><div><strong>Document unavailable</strong><span>The requested link is invalid.</span></div></div>';original.removeAttribute('href')}
    else{
      original.href=file;
      const ext=file.split('.').pop().toLowerCase();
      if(ext==='pdf'){
        const iframe=document.createElement('iframe');
        iframe.src=file+'#toolbar=1&navpanes=0&view=FitH';
        iframe.title=pretty;
        frame.appendChild(iframe);
      }else{
        const wrap=document.createElement('div');wrap.className='image-wrap';
        const img=document.createElement('img');img.src=file;img.alt=pretty;
        wrap.appendChild(img);frame.appendChild(wrap);
      }
    }
  </script>
<script src="language-switch.js"></script>
</body>
</html>
